name: Warehouse query

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  query:
    if: startsWith(github.event.issue.title, 'query:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: warehouse/requirements.txt

      - name: Install DuckDB
        run: pip install "$(grep '^duckdb==' warehouse/requirements.txt)"

      - name: Run the query and commit the result
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPLY_PATH: ${{ runner.temp }}/reply.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python warehouse/query.py
            git add README.md warehouse/state warehouse/section.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit --quiet --message "chore: answer warehouse query #$ISSUE_NUMBER"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Reply and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPLY_PATH: ${{ runner.temp }}/reply.md
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file "$REPLY_PATH"
          gh issue close "$ISSUE_NUMBER"

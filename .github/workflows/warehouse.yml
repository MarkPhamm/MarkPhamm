name: Warehouse

on:
  schedule:
    - cron: "40 0 * * *" # 07:40 in Ho Chi Minh City
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "warehouse/**"
      - "!warehouse/assets/**"
      - "!warehouse/exports/**"
      - "!warehouse/state/**"
      - ".github/workflows/warehouse.yml"

permissions:
  contents: write

concurrency: warehouse

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warehouse
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: warehouse/requirements.txt

      - name: Install dbt-duckdb
        run: pip install -r requirements.txt

      - name: Extract GitHub and WakaTime activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python extract.py

      - name: dbt seed
        run: dbt seed --profiles-dir .

      - name: dbt build
        run: |
          dbt build --profiles-dir . --exclude tag:personality
          cp target/run_results.json target/run_results_build.json

      - name: Personality tests
        run: dbt test --profiles-dir . --select tag:personality || true

      - name: Render lineage, exports and README
        run: python render.py

      - name: Commit if the warehouse changed
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add README.md warehouse/assets warehouse/exports warehouse/state
            if git diff --cached --quiet; then
              echo "The warehouse is unchanged; nothing to commit."
              exit 0
            fi
            git commit --quiet --message "chore: refresh warehouse"
            if git pull --rebase --quiet origin main && git push --quiet origin HEAD:main; then
              exit 0
            fi
            # a visitor query can rewrite the same README lines, so start again from main and re-render
            git rebase --abort 2>/dev/null || true
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            (cd warehouse && python render.py)
            sleep $((attempt * 5))
          done
          exit 1

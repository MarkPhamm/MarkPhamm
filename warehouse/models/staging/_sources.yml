version: 2

sources:
  - name: github
    description: My public GitHub activity, pulled from the GraphQL API by extract.py.
    config:
      meta:
        # The template formatter substitutes ${name} and leaves the columns struct braces alone.
        formatter: template
    tables:
      - name: contributions
        description: One row per day of my contribution calendar.
        config:
          meta:
            external_location: "read_json('raw/github_${name}.json', format = 'array', columns = {'day': 'date', 'contributions': 'integer'})"
      - name: repos
        description: Public repositories I own, excluding forks.
        config:
          meta:
            external_location: "read_json('raw/github_${name}.json', format = 'array', columns = {'name': 'varchar', 'stars': 'integer', 'language': 'varchar', 'pushed_at': 'timestamp', 'created_at': 'timestamp', 'description': 'varchar', 'url': 'varchar'})"
      - name: repo_commits
        description: Commits per public repository since January 1 of the current year.
        config:
          meta:
            external_location: "read_json('raw/github_${name}.json', format = 'array', columns = {'repo': 'varchar', 'commits': 'integer'})"

  - name: wakatime
    description: Coding time by language from WakaTime, or from the waka block in README.md when no API key is set.
    config:
      meta:
        formatter: template
    tables:
      - name: languages
        description: Seconds of coding per day and language. day is null when the data came from the README.
        config:
          meta:
            external_location: "read_json('raw/wakatime_${name}.json', format = 'array', columns = {'day': 'date', 'language': 'varchar', 'seconds': 'double'})"

name: mark_warehouse
version: "1.0.0"
profile: mark_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, logs]

flags:
  send_anonymous_usage_stats: false

models:
  mark_warehouse:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  mark_warehouse:
    career_roles:
      +column_types:
        company: varchar
        role: varchar
        start_date: date
        end_date: date
        url: varchar
